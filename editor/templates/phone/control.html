<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0a09">
<title>Jimmy's Signal Box</title>
<link rel="stylesheet" href="{{ url_for('static', filename='phone/fonts/oswald.css') }}">
<style>
  :root { --img: {{ url_for('static', filename='phone/img/') }}; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; background:#0b0a09; overflow:hidden;
    -webkit-text-size-adjust:100%; text-size-adjust:100%;
    font-family:'Oswald', 'Helvetica Neue Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none;
  }
  #stage {
    position:absolute; width:390px; height:844px; transform-origin:0 0;
    left:0; top:0; will-change:transform; overflow:hidden;
  }
  /* One horizontal track of full-width pages; swipe moves the track. */
  #track { position:absolute; left:0; top:0; height:844px; will-change:transform; }
  .page { position:absolute; top:0; width:390px; height:844px; overflow:hidden; }
  .page-bg { position:absolute; display:block; }
  .photo { position:absolute; display:block; object-fit:cover; }
  .lbl {
    position:absolute; color:#c1b29e; text-align:center;
    font-weight:500; letter-spacing:.06em; white-space:nowrap;
    display:flex; align-items:center; justify-content:center;
  }
  .dot { position:absolute; border-radius:50%; background:#71685d; }
  .strip-ind { position:absolute; }
  .strip-ind img { width:100%; height:100%; display:block; }
  .strip-lbl {
    position:absolute; display:flex; align-items:center; justify-content:center;
    color:#c1b29e; font-weight:500; letter-spacing:.05em; white-space:nowrap;
  }
  .dot.on { background:#fdf3df; }
  .knob-wrap { position:absolute; touch-action:none; cursor:grab; }
  .knob-wrap img { width:100%; height:100%; display:block; will-change:transform; }
  .knob-wrap.inert { opacity:.45; pointer-events:none; }

  /* Scene selector drum: a real cylinder, rows standing off the axis. */
  #drum-window { position:absolute; overflow:hidden; perspective:340px; }
  #drum { position:absolute; inset:0; transform-style:preserve-3d; will-change:transform; }
  .drum-row {
    position:absolute; left:0; right:0; margin:auto;
    display:flex; align-items:center; justify-content:center;
    font-weight:500; letter-spacing:.02em; white-space:nowrap;
    backface-visibility:hidden; text-align:center;
    padding:0 8px; overflow:hidden; text-overflow:ellipsis;
  }
  #sel-info {
    position:absolute; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px; padding:4px 10px;
    color:#e9e2d0; overflow:hidden;
  }
  #sel-info-name {
    font-weight:500; font-size:19px; line-height:22px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  #sel-info-sub { font-size:14px; line-height:16px; color:#a2977f; font-variant-numeric:tabular-nums; }
  .sel-hit { position:absolute; cursor:pointer; }
  .ctl { position:absolute; display:block; }
  .ctl img { width:100%; height:100%; display:block; pointer-events:none; }
  .ctl.hit, .pad { cursor:pointer; touch-action:none; }
  .ctl.press { filter:brightness(1.12); }

  /* knob rotates about its own centre */
  #knob-wrap { position:absolute; touch-action:none; cursor:grab; }
  #knob { width:100%; height:100%; display:block; will-change:transform; }

  /* live display window */
  #next-mask { position:absolute; }
  #next-line {
    position:absolute; display:flex; align-items:center; justify-content:center;
    color:#c1b29e; font-weight:400; letter-spacing:.04em; white-space:nowrap;
  }
  #win { position:absolute; overflow:hidden; color:#e9e2d0; }
  /* Fixed bands inside the 54pt window: title 2..29, row 34..49. They cannot collide. */
  #win-title {
    position:absolute; left:13px; right:11px; top:2px; height:27px;
    font-weight:500; font-size:21px; line-height:27px; letter-spacing:.005em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    text-shadow:0 0 10px rgba(233,226,208,.16);
  }
  #win-title.dim { color:#6f6a5e; text-shadow:none; }
  #win-row {
    position:absolute; left:13px; right:11px; bottom:5px; height:15px;
    display:flex; align-items:center; gap:9px;
  }
  #bar {
    flex:1; height:10px; border-radius:5px; background:#2a2724;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.85); overflow:hidden;
  }
  #bar-fill {
    height:100%; width:0%; border-radius:5px; background:#d9d2c0;
    transition:width .25s linear;
  }
  #win-time {
    font-weight:400; font-size:15px; line-height:1; letter-spacing:.02em;
    color:#cfc8b6; white-space:nowrap; font-variant-numeric:tabular-nums;
  }
  #win.off #bar-fill { background:#4a463f; }

  /* tap targets are generous without moving the artwork */
  .pad { position:absolute; }
</style>

<div id="stage"><div id="track"><div class="page" id="page-0" style="left:0">
  <img id="panel" class="page-bg" style="left:-2.54px; top:-2px; width:392.66px; height:845.85px"
       src="{{ url_for('static', filename='phone/img/panel.webp') }}" alt="">

  <!-- Pi connection lamp (indicator only) -->
  <div class="ctl" id="pi-lamp"></div>

  <!-- Day / Night lever -->
  <div class="ctl hit" id="lever"></div>
  <div class="pad" id="lever-day"   style="left:40px;  top:160px; width:62px; height:86px;"></div>
  <div class="pad" id="lever-night" style="left:128px; top:160px; width:62px; height:86px;"></div>

  <!-- Transport -->
  <div class="ctl hit" id="play"></div>
  <div class="ctl hit" id="pause"></div>
  <div class="ctl hit" id="stop"></div>

  <!-- Master volume -->
  <div id="knob-wrap"><img id="knob" src="{{ url_for('static', filename='phone/img/knob.webp') }}" alt=""></div>

  <!-- Now playing -->
  <div id="win">
    <div id="win-title" class="dim">—</div>
    <div id="win-row"><div id="bar"><div id="bar-fill"></div></div><div id="win-time"></div></div>
  </div>

  <!-- Next scene countdown, over the rectangle masked in the artwork -->
  <div id="next-mask"></div>
  <div id="next-line"></div>

  <!-- Utilities -->
  <div class="ctl hit" id="led"></div>
  <div class="ctl hit" id="reboot"></div>
</div></div></div>

<script>
const G = {{ geometry | tojson }};
const IMG = "{{ url_for('static', filename='phone/img/') }}";

/* ── stage scaling: keep the artboard exact, fit it to the screen ───────────── */
function fit() {
  const s = Math.min(innerWidth / G.artboard.w, innerHeight / G.artboard.h);
  const st = document.getElementById('stage');
  st.style.transform = `translate(${(innerWidth - G.artboard.w*s)/2}px, ${(innerHeight - G.artboard.h*s)/2}px) scale(${s})`;
  st.dataset.scale = s;
  st.dataset.ox = (innerWidth - G.artboard.w*s)/2;
  st.dataset.oy = (innerHeight - G.artboard.h*s)/2;
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 120));
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
addEventListener('load', fit);
fit(); requestAnimationFrame(fit); setTimeout(fit, 200); setTimeout(fit, 700);

/* ── place a control and give it a state image ─────────────────────────────── */
function place(el, spec) {
  el.style.left = spec.x + 'px'; el.style.top = spec.y + 'px';
  el.style.width = spec.w + 'px'; el.style.height = spec.h + 'px';
  let img = el.querySelector('img');
  if (!img) { img = document.createElement('img'); el.appendChild(img); }
  const src = IMG + spec.img + '.webp';
  if (img.getAttribute('src') !== src) img.setAttribute('src', src);
  el.style.transform = spec.mirror ? 'scaleX(-1)' : '';
}
const setState = (id, spec) => place(document.getElementById(id), spec);

/* live window + knob geometry */
const win = document.getElementById('win');
Object.assign(win.style, {left:G.live.window.x+'px', top:G.live.window.y+'px',
                          width:G.live.window.w+'px', height:G.live.window.h+'px'});
const NL = G.live.next_line;
Object.assign(document.getElementById('next-mask').style,
  {left:NL.mask.x+'px', top:NL.mask.y+'px', width:NL.mask.w+'px', height:NL.mask.h+'px',
   background:NL.mask.fill});
Object.assign(document.getElementById('next-line').style,
  {left:NL.text.x+'px', top:NL.text.y+'px', width:NL.text.w+'px', height:NL.text.h+'px',
   fontSize:NL.text.size+'px'});

const K = G.controls.knob, kw = document.getElementById('knob-wrap');
Object.assign(kw.style, {left:(K.cx-K.size/2)+'px', top:(K.cy-K.size/2)+'px',
                         width:K.size+'px', height:K.size+'px'});

/* ── volume: interpolate rotation between the five printed reference marks ─── */
function pctToDeg(p) {
  const r = K.refs; p = Math.max(0, Math.min(100, p));
  for (let i=0; i<r.length-1; i++)
    if (p <= r[i+1][0]) {
      const t = (p - r[i][0]) / (r[i+1][0] - r[i][0]);
      return r[i][1] + t * (r[i+1][1] - r[i][1]);
    }
  return r[r.length-1][1];
}
function degToPct(d) {
  const r = K.refs;
  if (d <= 0) return 0;
  for (let i=0; i<r.length-1; i++)
    if (d <= r[i+1][1]) {
      const t = (d - r[i][1]) / (r[i+1][1] - r[i][1]);
      return r[i][0] + t * (r[i+1][0] - r[i][0]);
    }
  return 100;
}
let volume = 50, volPending = null, volDrag = false;
function drawKnob() {
  const deg = (K.base_rotation_deg || 0) + pctToDeg(volume);
  document.getElementById('knob').style.transform = `rotate(${deg}deg)`;
}

function stagePoint(ev) {
  const st = document.getElementById('stage'), s = +st.dataset.scale;
  const t = ev.touches ? ev.touches[0] : ev;
  return { x: (t.clientX - +st.dataset.ox)/s, y: (t.clientY - +st.dataset.oy)/s };
}
function knobFromPoint(p) {
  let bearing = Math.atan2(p.y - K.cy, p.x - K.cx) * 180/Math.PI;
  let rel = ((bearing - K.zero_bearing_deg) % 360 + 360) % 360;
  const span = K.refs[K.refs.length-1][1];
  if (rel > span) rel = (rel > (span + 360)/2) ? 0 : span;   // outside the sweep: snap to nearest end
  return degToPct(rel);
}
function sendVolume() {
  hold();
  clearTimeout(volPending);
  volPending = setTimeout(() => api('/api/volume', {volume: volume/100}), 90);
}
kw.addEventListener('pointerdown', e => {
  e.preventDefault(); volDrag = true;
  capture(kw, e);
  volume = knobFromPoint(stagePoint(e)); drawKnob(); sendVolume();
});
kw.addEventListener('pointermove', e => {
  if (!volDrag) return; e.preventDefault();
  volume = knobFromPoint(stagePoint(e)); drawKnob(); sendVolume();
});
['pointerup','pointercancel'].forEach(t => kw.addEventListener(t, () => { volDrag = false; }));

// Pointer capture keeps a drag alive when the finger leaves the control, but it
// throws if the pointer is no longer active — never let that abort the handler.
function capture(el, e) {
  try { el.setPointerCapture && el.setPointerCapture(e.pointerId); } catch (_) {}
}

/* ── api helper ────────────────────────────────────────────────────────────── */
async function api(path, body) {
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}
                   : {method:'POST'};
  try {
    const r = await fetch(path, opt);
    const d = await r.json().catch(() => ({}));
    return Object.assign(d, {_ok: r.ok, _status: r.status});
  } catch (e) {
    return {_ok: false, _status: 0, error: 'no connection'};
  }
}
const get = p => fetch(p).then(r => r.json());

/* ── UI state ──────────────────────────────────────────────────────────────── */
let atmo = 'day', playing = false, paused = false, ledTest = false, online = false;
let rebooting = false, blinkOn = false, sawOffline = false, rebootStarted = 0;
const REBOOT_BLINK_MS = 550, REBOOT_GIVE_UP_MS = 150000;
setInterval(() => {
  if (!rebooting) { if (blinkOn) { blinkOn = false; render(); } return; }
  blinkOn = !blinkOn; render();
}, REBOOT_BLINK_MS);
// After a tap, trust the UI for a moment so the status poll can't undo it
// before the server has caught up.
let holdUntil = 0;
const hold = (ms = 1600) => { holdUntil = Date.now() + ms; };
const held = () => Date.now() < holdUntil;
// A short message shown in the display window (errors, confirmations).
let flashUntil = 0, flashMsg = '';
function flash(msg, ms = 2600) { flashMsg = msg; flashUntil = Date.now() + ms; }

function render() {
  setState('pi-lamp', G.controls.pi_lamp[online ? 'on' : 'off']);
  setState('lever',   G.controls.lever[atmo === 'night' ? 'night' : 'day']);
  setState('play',    G.controls.play [playing && !paused ? 'on' : 'off']);
  setState('pause',   G.controls.pause[paused            ? 'on' : 'off']);
  setState('stop',    G.controls.stop [!playing && !paused ? 'on' : 'off']);
  setState('led',     G.controls.led_test[ledTest ? 'on' : 'off']);
  // The reboot lamp blinks steadily while the Pi restarts, and is out otherwise.
  setState('reboot',  G.controls.reboot[(rebooting && blinkOn) ? 'on' : 'off']);
  renderSelector();
  drawKnob();
  renderLamps();
}

function press(el, fn) {
  let armed = false;
  // No preventDefault here: cancelling the default on pointerdown suppresses the
  // compatibility click and hangs mouse interaction. touch-action:none already
  // stops scrolling and selection on the phone.
  el.addEventListener('pointerdown', e => {
    armed = true;
    capture(el, e);
    el.classList.add('press');
  });
  el.addEventListener('pointerup', () => {
    el.classList.remove('press');
    if (armed) { armed = false; fn(); }
  });
  el.addEventListener('pointercancel', () => { armed = false; el.classList.remove('press'); });
  el.addEventListener('contextmenu', e => e.preventDefault());
}
const byId = id => document.getElementById(id);

press(byId('lever-day'),   () => setAtmo('day'));
press(byId('lever-night'), () => setAtmo('night'));
async function setAtmo(a) {
  if (a === atmo) return;
  atmo = a; hold(); render(); loadScenes();
  await api('/api/atmosphere', {atmosphere: a});
  if (playing) await api('/api/simulate/' + a);          // restart the programme in the new atmosphere
}

press(byId('play'), async () => {
  hold();
  if (paused) { await api('/api/transport/unpause'); paused = false; playing = true; }
  else        { await api('/api/simulate/' + atmo);  playing = true; paused = false; }
  render();
});
press(byId('pause'), async () => {
  if (!playing || paused) return;
  hold(); await api('/api/transport/pause'); paused = true; render();
});
press(byId('stop'), async () => {
  hold(); await api('/api/stop_all'); playing = false; paused = false; render(); showIdle();
});
press(byId('led'), async () => {
  const want = !ledTest;
  ledTest = want; hold(); render();
  const res = await api(want ? '/api/led/test' : '/api/led/test/stop');
  if (want && res._ok === false) {
    ledTest = false; holdUntil = 0; render();
    flash(res.error || 'LED test unavailable');
  }
});
press(byId('reboot'), async () => {
  rebooting = true; blinkOn = true; sawOffline = false; rebootStarted = Date.now();
  hold(4000); render();
  const res = await api('/api/reboot');
  if (res._ok === false) {
    rebooting = false; blinkOn = false; holdUntil = 0; render();
    flash(res.error || 'Reboot unavailable');
  }
});

// The Pi drops off the network, then comes back. Stop blinking once we have seen
// it go and return — or give up after a couple of minutes.
function trackReboot(reachable) {
  if (!rebooting) return;
  if (!reachable) { sawOffline = true; return; }
  if (sawOffline && Date.now() - rebootStarted > 4000) {
    rebooting = false; blinkOn = false; flash('Back online');
  } else if (Date.now() - rebootStarted > REBOOT_GIVE_UP_MS) {
    rebooting = false; blinkOn = false;
  }
}

/* ── the display window ────────────────────────────────────────────────────── */
const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
function setNextLine(text) { document.getElementById('next-line').textContent = text || ''; }

function showScene(name, elapsed, total) {
  const t = byId('win-title');
  t.textContent = name; t.classList.remove('dim');
  win.classList.remove('off');
  byId('bar-fill').style.width = (total > 0 ? Math.min(100, elapsed/total*100) : 0) + '%';
  byId('win-time').textContent = fmt(elapsed) + ' / ' + fmt(total);
}
function showWaiting(next) {
  const t = byId('win-title');
  t.textContent = next || 'Waiting';
  t.classList.add('dim'); win.classList.add('off');
  byId('bar-fill').style.width = '0%';
  byId('win-time').textContent = '';
}
function showIdle(msg) {
  const t = byId('win-title');
  t.textContent = msg || (online ? 'Stopped' : 'No connection');
  t.classList.add('dim'); win.classList.add('off');
  byId('bar-fill').style.width = '0%'; byId('win-time').textContent = '';
}


/* ── lamp pages: built from geometry, one per wired channel ────────────────── */
const P = G.pages, LC = P.lamp_common, LAMPS = P.lamps;
const PAGE_W = G.artboard.w, PAGE_COUNT = 1 + LAMPS.length + 1;   // + the scene selector
const track = document.getElementById('track');
track.style.width = (PAGE_W * PAGE_COUNT) + 'px';

// live values per channel, mirrored from the server
const lampState = {};
LAMPS.forEach(l => lampState[l.channel] = {enabled:false, brightness:70, flicker_speed:2, flicker_depth:40});
let stoveVolume = 100;

function el(tag, cls, style, parent) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (style) Object.assign(e.style, style);
  if (parent) parent.appendChild(e);
  return e;
}
const pxs = o => Object.fromEntries(Object.entries(o).map(([k,v]) => [k, v+'px']));
// geometry files use x/y/w/h; CSS wants left/top/width/height
const box = o => ({left:o.x+'px', top:o.y+'px', width:o.w+'px', height:o.h+'px'});

function buildLampPage(lamp, index) {
  const page = el('div', 'page', {left: (PAGE_W*index)+'px'}, track);
  page.id = 'page-' + index;

  const bg = el('img', 'page-bg', pxs({left:P.lamp_background.x, top:P.lamp_background.y,
                                       width:P.lamp_background.w, height:P.lamp_background.h}), page);
  bg.src = IMG + P.lamp_background.img + '.webp'; bg.alt = '';

  const ph = el('img', 'photo', pxs({left:lamp.frame.x, top:lamp.frame.y,
                                     width:lamp.frame.w, height:lamp.frame.h}), page);
  ph.src = IMG + lamp.photo + '.webp'; ph.alt = '';

  // labels painted over the masked areas of the artwork
  // Each label is a mask over the printed one, plus our own text on top.
  const label = (spec, text) => {
    el('div', '', {position:'absolute', background:spec.mask.fill,
                   ...pxs({left:spec.mask.x, top:spec.mask.y,
                           width:spec.mask.w, height:spec.mask.h})}, page);
    const e = el('div', 'lbl', {...pxs({left:spec.text.x, top:spec.text.y,
                                        width:spec.text.w, height:spec.text.h}),
                                fontSize: spec.text.size+'px'}, page);
    e.textContent = text;
  };
  label(LC.name_label, lamp.name);
  label(LC.page_label, `${lamp.n}/${LAMPS.length}  ${lamp.name.charAt(0)+lamp.name.slice(1).toLowerCase()}`);

  // page dots, drawn over the ones printed in the artwork
  LC.dots.xs.forEach((x, i) => {
    const d = el('div', 'dot' + (i === lamp.n-1 ? ' on' : ''),
                 pxs({left:x-LC.dots.r, top:LC.dots.y-LC.dots.r, width:LC.dots.r*2, height:LC.dots.r*2}), page);
    d.dataset.dot = i;
  });

  // arrows
  const la = el('div', '', {...pxs(LC.arrow_left), position:'absolute', cursor:'pointer'}, page);
  Object.assign(la.style, pxs({left:LC.arrow_left.x, top:LC.arrow_left.y, width:LC.arrow_left.w, height:LC.arrow_left.h}));
  press(la, () => goTo(index - 1));
  const ra = el('div', '', {position:'absolute', cursor:'pointer'}, page);
  Object.assign(ra.style, pxs({left:LC.arrow_right.x, top:LC.arrow_right.y, width:LC.arrow_right.w, height:LC.arrow_right.h}));
  press(ra, () => goTo(index + 1));

  // Status strip: the other three lamps, in page order, with their own indicator art.
  const SS = LC.status_strip;
  LAMPS.filter(o => o.n !== lamp.n).forEach((other, i) => {
    const slot = SS.slots[i];
    el('div', '', {position:'absolute', background:SS.label_mask,
                   ...pxs({left:slot.label.x, top:slot.label.y,
                           width:slot.label.w, height:slot.label.h})}, page);
    const lb = el('div', 'strip-lbl', {...pxs({left:slot.label.x, top:slot.label.y,
                                               width:slot.label.w, height:slot.label.h}),
                                       fontSize:SS.label_size+'px'}, page);
    lb.textContent = other.strip_name;
    const ind = el('div', 'strip-ind', {}, page);
    ind.dataset.ind = other.channel; ind.dataset.slot = i;
    el('img', '', {}, ind);

    // live reading over the printed "ON ---%"
    el('div', '', {position:'absolute', background:SS.value_mask,
                   ...pxs({left:slot.value.x, top:slot.value.y,
                           width:slot.value.w, height:slot.value.h})}, page);
    const val = el('div', 'strip-lbl', {...pxs({left:slot.value.x, top:slot.value.y,
                                                width:slot.value.w, height:slot.value.h}),
                                        fontSize:SS.value_size+'px'}, page);
    val.dataset.val = other.channel;
  });

  // on/off lever
  const tog = el('div', 'ctl hit', {}, page);
  tog.id = 'lamp-toggle-' + lamp.channel;
  press(tog, () => {
    const st = lampState[lamp.channel];
    st.enabled = !st.enabled; hold(); renderLamp(lamp);
    sendLed(lamp.channel);
  });

  // four dials
  const mk = (key, value, max, enabled) => {
    const g = LC.knobs[key];
    const w = el('div', 'knob-wrap' + (enabled ? '' : ' inert'),
                 pxs({left:g.cx-g.size/2, top:g.cy-g.size/2, width:g.size, height:g.size}), page);
    w.id = `knob-${lamp.channel}-${key}`;
    const i = el('img', '', {}, w); i.src = IMG + LC.knob_dial.img + '.webp'; i.alt = '';
    if (enabled) attachDial(w, g, v => onDial(lamp, key, v), () => dialValue(lamp, key));
    else i.style.transform = `rotate(${LC.knob_dial.base_rotation_deg}deg)`;   // parked at zero
    return w;
  };
  mk('brightness', 0, 100, true);
  mk('flicker_speed', 0, 100, true);
  mk('flicker_depth', 0, 100, true);
  mk('sound', 0, 100, !!lamp.sound);

  return page;
}

/* dial value <-> control value */
function dialValue(lamp, key) {
  const st = lampState[lamp.channel];
  if (key === 'brightness')    return st.brightness;
  if (key === 'flicker_depth') return st.flicker_depth;
  if (key === 'flicker_speed') return (st.flicker_speed - 1) / 4 * 100;   // 1..5 -> 0..100
  if (key === 'sound')         return stoveVolume;
  return 0;
}
function onDial(lamp, key, pct) {
  // Hold the UI briefly: without this the next status poll overwrites the value
  // you are turning before the box has stored it.
  hold();
  const st = lampState[lamp.channel];
  if (key === 'brightness')    st.brightness = Math.round(pct);
  if (key === 'flicker_depth') { st.flicker_depth = Math.round(pct); }
  if (key === 'flicker_speed') st.flicker_speed = +(1 + pct/100*4).toFixed(1);
  if (key === 'sound')       { stoveVolume = Math.round(pct); queueStove(); return; }
  sendLed(lamp.channel);
}

/* a dial: drag round it, 0 at the 135 deg mark, 270 deg clockwise to full */
function attachDial(wrap, geo, onChange, getValue) {
  const D = LC.knob_dial;
  const img = wrap.querySelector('img');
  wrap.dataset.draw = '1';
  wrap.redraw = () => { img.style.transform = `rotate(${D.base_rotation_deg + getValue()/100*D.sweep_deg}deg)`; };
  wrap.redraw();
  let dragging = false;
  const valueAt = e => {
    // The visible page is translated flush with the stage, so stage coords are
    // page-local coords for whichever page is on screen.
    const p = stagePoint(e);
    let bearing = Math.atan2(p.y - geo.cy, p.x - geo.cx) * 180/Math.PI;
    let rel = ((bearing - D.zero_bearing_deg) % 360 + 360) % 360;
    if (rel > D.sweep_deg) rel = (rel > (D.sweep_deg + 360)/2) ? 0 : D.sweep_deg;
    return rel / D.sweep_deg * 100;
  };
  wrap.addEventListener('pointerdown', e => {
    e.stopPropagation(); dragging = true;
    capture(wrap, e);
    onChange(valueAt(e)); wrap.redraw();
  });
  wrap.addEventListener('pointermove', e => {
    if (!dragging) return; e.preventDefault(); e.stopPropagation();
    onChange(valueAt(e)); wrap.redraw();
  });
  ['pointerup','pointercancel'].forEach(t => wrap.addEventListener(t, () => { dragging = false; }));
}

/* pushing changes to the box, coalesced */
const ledTimers = {};
function sendLed(channel) {
  clearTimeout(ledTimers[channel]);
  ledTimers[channel] = setTimeout(() => {
    const st = lampState[channel];
    api('/api/led', {atmosphere: atmo, channel,
                     led: {enabled: st.enabled, brightness: st.brightness,
                           flicker: st.flicker_depth > 0,
                           flicker_speed: st.flicker_speed, flicker_depth: st.flicker_depth}});
  }, 120);
}
let stoveTimer = null;
function queueStove() {
  clearTimeout(stoveTimer);
  stoveTimer = setTimeout(() => api('/api/stove/volume', {volume: stoveVolume/100}), 120);
}

function renderLamp(lamp) {
  const st = lampState[lamp.channel];
  const tog = document.getElementById('lamp-toggle-' + lamp.channel);
  if (tog) place(tog, LC.toggle[st.enabled ? 'on' : 'off']);
  ['brightness','flicker_speed','flicker_depth','sound'].forEach(k => {
    const w = document.getElementById(`knob-${lamp.channel}-${k}`);
    if (w && w.redraw) w.redraw();
  });
}
function renderLamps() { LAMPS.forEach(renderLamp); renderStrip(); }

// The strip repeats on every lamp page, so update every copy.
function renderStrip() {
  const SS = LC.status_strip;
  document.querySelectorAll('[data-ind]').forEach(ind => {
    const st  = lampState[ind.dataset.ind];
    const lit = !!(st && st.enabled && st.brightness > 0);
    const box = SS.slots[+ind.dataset.slot][lit ? 'ind_on' : 'ind_off'];
    Object.assign(ind.style, pxs({left:box.x, top:box.y, width:box.w, height:box.h}));
    const img = ind.querySelector('img');
    const src = IMG + (lit ? SS.img_on : SS.img_off) + '.webp';
    if (img.getAttribute('src') !== src) img.setAttribute('src', src);
  });
  document.querySelectorAll('[data-val]').forEach(v => {
    const st = lampState[v.dataset.val];
    const on = !!(st && st.enabled);
    v.textContent = on ? `ON  ${Math.round(st.brightness)}%` : 'OFF';
    v.style.color = on ? '#c1b29e' : '#6a6154';
  });
}

// Take the box's own LED settings for the current atmosphere.
function adoptLeds(leds, stoveVol) {
  let changed = false;
  LAMPS.forEach(l => {
    const src = leds[l.channel]; if (!src) return;
    const st = lampState[l.channel];
    const next = {
      enabled:       !!src.enabled,
      brightness:    src.brightness ?? st.brightness,
      flicker_speed: src.flicker_speed ?? st.flicker_speed,
      flicker_depth: src.flicker ? (src.flicker_depth ?? st.flicker_depth) : 0,
    };
    for (const k in next) if (next[k] !== st[k]) { st[k] = next[k]; changed = true; }
  });
  if (typeof stoveVol === 'number') {
    const v = Math.round(stoveVol * 100);
    if (v !== stoveVolume) { stoveVolume = v; changed = true; }
  }
  if (changed) renderLamps();
}


/* ── scene selector: the last page ─────────────────────────────────────────── */
const SEL = P.selector;
let selScenes = [], selIndex = 0, selPlayingId = null;
// A scene fired by hand is not the scheduler running, so the selector's Play
// lamp follows the sounding scene rather than the programme.
let scenePlaying = false;

function buildSelectorPage(index) {
  const page = el('div', 'page', {left: (PAGE_W*index)+'px'}, track);
  page.id = 'page-' + index;

  const bg = el('img', 'page-bg', pxs({left:SEL.background.x, top:SEL.background.y,
                                       width:SEL.background.w, height:SEL.background.h}), page);
  bg.src = IMG + SEL.background.img + '.webp'; bg.alt = '';

  const lamp = el('div', 'ctl', {}, page); lamp.id = 'sel-lamp';
  const lever = el('div', 'ctl hit', {}, page); lever.id = 'sel-lever';
  [['day', SEL.lever_pads.day], ['night', SEL.lever_pads.night]].forEach(([which, pad]) => {
    const p = el('div', 'sel-hit', box(pad), page);
    press(p, () => setAtmo(which));
  });

  // the drum
  const w = el('div', '', box(SEL.drum.window), page);
  w.id = 'drum-window';
  const drum = el('div', '', {}, w); drum.id = 'drum';

  // wheels and arrows drive the same drum
  SEL.wheels.forEach(g => attachWheel(el('div', 'sel-hit', box(g), page)));
  SEL.arrows.up.forEach(g   => press(el('div', 'sel-hit', box(g), page), () => stepScene(-1)));
  SEL.arrows.down.forEach(g => press(el('div', 'sel-hit', box(g), page), () => stepScene(+1)));

  const info = el('div', '', box(SEL.info), page); info.id = 'sel-info';
  el('div', '', {}, info).id = 'sel-info-name';
  el('div', '', {}, info).id = 'sel-info-sub';

  ['play','pause','stop'].forEach(k => {
    const c = el('div', 'ctl hit', {}, page); c.id = 'sel-' + k;
  });
  press(document.getElementById('sel-play'),  playSelectedScene);
  press(document.getElementById('sel-pause'), async () => { hold(); await api('/api/transport/pause'); paused = true; render(); });
  press(document.getElementById('sel-stop'),  async () => {
    hold(); await api('/api/stop_all');
    playing = false; paused = false; scenePlaying = false; selPlayingId = null;
    render(); drawSelInfo();
  });

  const back = el('div', 'ctl hit', {}, page); back.id = 'sel-back';
  place(back, SEL.back);
  press(back, () => goTo(0));
  return page;
}

/* drag anywhere on a thumbwheel to spin the drum */
function attachWheel(wrap) {
  let dragging = false, startY = 0, startIdx = 0;
  wrap.addEventListener('pointerdown', e => {
    e.stopPropagation(); dragging = true; capture(wrap, e);
    startY = stagePoint(e).y; startIdx = selIndex; drumSnap(false);
  });
  wrap.addEventListener('pointermove', e => {
    if (!dragging) return; e.preventDefault(); e.stopPropagation();
    const dy = stagePoint(e).y - startY;
    setSelIndex(startIdx + dy / (SEL.drum.row_height * 0.62), false);
  });
  ['pointerup','pointercancel'].forEach(t => wrap.addEventListener(t, () => {
    if (!dragging) return; dragging = false; setSelIndex(Math.round(selIndex), true);
  }));
}

/* and on the drum face itself */
function attachDrumDrag(w) {
  let dragging = false, startY = 0, startIdx = 0;
  w.addEventListener('pointerdown', e => {
    e.stopPropagation(); dragging = true; capture(w, e);
    startY = stagePoint(e).y; startIdx = selIndex; drumSnap(false);
  });
  w.addEventListener('pointermove', e => {
    if (!dragging) return; e.preventDefault(); e.stopPropagation();
    const dy = stagePoint(e).y - startY;
    setSelIndex(startIdx - dy / (SEL.drum.row_height * 0.9), false);
  });
  ['pointerup','pointercancel'].forEach(t => w.addEventListener(t, () => {
    if (!dragging) return; dragging = false; setSelIndex(Math.round(selIndex), true);
  }));
}

const drumSnap = on => {
  const d = document.getElementById('drum');
  if (d) d.style.transition = on ? 'transform .32s cubic-bezier(.22,.68,.3,1)' : 'none';
};
function stepScene(delta) { drumSnap(true); setSelIndex(Math.round(selIndex) + delta, true); }

function setSelIndex(v, snap) {
  if (!selScenes.length) return;
  const max = selScenes.length - 1;
  selIndex = Math.max(-0.4, Math.min(max + 0.4, v));
  if (snap) { selIndex = Math.max(0, Math.min(max, Math.round(selIndex))); drumSnap(true); }
  drawDrum();
  if (snap) drawSelInfo();
}

/* Rebuild the rows only when the scene list changes; rotating is just a transform. */
function buildDrumRows() {
  const d = document.getElementById('drum');
  if (!d) return;
  d.innerHTML = '';
  const D = SEL.drum;
  selScenes.forEach((sc, i) => {
    const row = el('div', 'drum-row', {
      height: D.row_height + 'px',
      top: (D.window.h/2 - D.row_height/2) + 'px',
      fontSize: '16px',
      transform: `rotateX(${-i * D.step_deg}deg) translateZ(${D.radius}px)`,
    }, d);
    row.textContent = sc.name;
    row.dataset.i = i;
  });
  drawDrum();
}

function drawDrum() {
  const d = document.getElementById('drum');
  if (!d) return;
  const D = SEL.drum;
  d.style.transform = `rotateX(${selIndex * D.step_deg}deg)`;
  // the lit band is painted on the artwork, so the centred row inverts to dark ink
  [...d.children].forEach(row => {
    const off = Math.abs(+row.dataset.i - selIndex);
    const centred = off < 0.5;
    row.style.color   = centred ? '#241c0c' : '#9d9179';
    row.style.opacity = String(Math.max(0, 1 - off * 0.42));
    row.style.fontWeight = centred ? '600' : '500';
  });
}

const fmtClock = s => { s = Math.max(0, Math.round(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };

function drawSelInfo(elapsed, total) {
  const nameEl = document.getElementById('sel-info-name');
  const subEl  = document.getElementById('sel-info-sub');
  if (!nameEl) return;
  const sc = selScenes[Math.round(selIndex)];
  if (!sc) { nameEl.textContent = 'No scenes'; subEl.textContent = ''; return; }
  nameEl.textContent = sc.name;
  const live = selPlayingId === sc.id && total > 0;
  subEl.textContent = live ? `${fmtClock(elapsed)} / ${fmtClock(total)}`
                           : (sc.length ? fmtClock(sc.length) : '');
}

async function loadScenes() {
  try {
    const list = await get(`/api/scenes/${atmo}`);
    const keepId = selScenes[Math.round(selIndex)]?.id;
    selScenes = list;
    const at = keepId ? list.findIndex(s => s.id === keepId) : -1;
    selIndex = at >= 0 ? at : 0;
    buildDrumRows(); drawSelInfo();
  } catch (_) {}
}

async function playSelectedScene() {
  const sc = selScenes[Math.round(selIndex)];
  if (!sc) return;
  hold();
  selPlayingId = sc.id; scenePlaying = true; paused = false; render();
  await api(`/api/preview/${atmo}/${sc.id}`);
}

function renderSelector() {
  if (!document.getElementById('sel-lamp')) return;
  place(document.getElementById('sel-lamp'),  SEL.pi_lamp[online ? 'on' : 'off']);
  place(document.getElementById('sel-lever'), SEL.lever[atmo === 'night' ? 'night' : 'day']);
  const lit = (scenePlaying || playing) && !paused;
  place(document.getElementById('sel-play'),  SEL.play [lit ? 'on' : 'off']);
  place(document.getElementById('sel-pause'), SEL.pause[paused ? 'on' : 'off']);
  place(document.getElementById('sel-stop'),  SEL.stop [!lit && !paused ? 'on' : 'off']);
}

/* ── swiping ───────────────────────────────────────────────────────────────── */
let trackPage = 0, swipeFrom = 0, swiping = false, swipeStartX = 0, swipeStartY = 0, swipeLocked = null;
function drawTrack(animate) {
  track.style.transition = animate ? 'transform .28s cubic-bezier(.22,.61,.36,1)' : 'none';
  track.style.transform = `translateX(${-trackPage * PAGE_W}px)`;
}
function goTo(i, animate = true) {
  // Swiping on past the selector comes round to the main panel again.
  if (i >= PAGE_COUNT) { trackPage = PAGE_COUNT - 1; drawTrack(animate); wrapTo(0); return; }
  if (i < 0)           { trackPage = 0;              drawTrack(animate); return; }
  trackPage = i;
  drawTrack(animate);
}
// Slide to the edge, then jump silently so the wrap does not rewind five pages.
function wrapTo(target) {
  setTimeout(() => { trackPage = target; drawTrack(false); }, 300);
}
const stageEl = document.getElementById('stage');
stageEl.addEventListener('pointerdown', e => {
  if (e.target.closest('.knob-wrap, .ctl.hit, .pad, #knob-wrap')) return;   // controls win
  swiping = true; swipeLocked = null; swipeFrom = trackPage;
  const p = stagePoint(e); swipeStartX = p.x; swipeStartY = p.y;
});
stageEl.addEventListener('pointermove', e => {
  if (!swiping) return;
  const p = stagePoint(e);
  const dx = p.x - swipeStartX, dy = p.y - swipeStartY;
  if (swipeLocked === null) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    swipeLocked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }
  if (swipeLocked !== 'x') return;
  e.preventDefault();
  let off = swipeFrom * PAGE_W - dx;
  off = Math.max(-60, Math.min((PAGE_COUNT-1)*PAGE_W + 60, off));   // rubber band at the ends
  track.style.transition = 'none';
  track.style.transform = `translateX(${-off}px)`;
});
['pointerup','pointercancel'].forEach(t => stageEl.addEventListener(t, e => {
  if (!swiping) return;
  swiping = false;
  if (swipeLocked !== 'x') return;
  const dx = stagePoint(e).x - swipeStartX;
  const step = Math.abs(dx) > PAGE_W * 0.18 ? (dx < 0 ? 1 : -1) : 0;
  goTo(swipeFrom + step);
}));

LAMPS.forEach((l, i) => buildLampPage(l, i + 1));
buildSelectorPage(PAGE_COUNT - 1);
attachDrumDrag(document.getElementById('drum-window'));
drawTrack(false);

/* ── polling ───────────────────────────────────────────────────────────────── */
async function boot() {
  try {
    const st = await get('/api/state');
    online = true; atmo = st.atmosphere || 'day'; playing = !!st.playing;
    if (!volDrag) { volume = Math.round((st.volume ?? .5) * 100); }
    const lt = await get('/api/led/test/status').catch(() => ({running:false}));
    ledTest = !!lt.running;
    const ps = await get('/api/phone/status').catch(() => null);
    if (ps && ps.leds) adoptLeds(ps.leds, ps.stove_volume);
    await loadScenes();
  } catch { online = false; }
  render();
}
async function tick() {
  try {
    const s = await get('/api/phone/status');
    const sim = s.simulate, pv = s.preview;
    online = true; trackReboot(true);
    if (!volDrag && typeof s.volume === 'number') {
      const v = Math.round(s.volume * 100);
      if (v !== volume) { volume = v; drawKnob(); }
    }
    if (typeof s.led_test === 'boolean' && !held()) ledTest = s.led_test;
    if (s.leds && !held()) adoptLeds(s.leds, s.stove_volume);
    if (!held()) {
      if (sim.running !== playing && !paused) playing = sim.running;
      if (sim.atmosphere && sim.atmosphere !== atmo) atmo = sim.atmosphere;
    }
    if (sim.running && sim.mode === 'waiting' && sim.next_in > 0) {
      const sec = Math.round(sim.next_in);
      setNextLine(sec >= 60 ? `Next scene in ${Math.round(sec/60)} min`
                            : `Next scene in ${sec} sec`);
    } else if (sim.running) { setNextLine('Scene playing'); }
    else { setNextLine(''); }
    if (rebooting) { showIdle('Rebooting…'); render(); return; }
    if (Date.now() < flashUntil) { showIdle(flashMsg); render(); return; }
    if (pv.playing && pv.total > 0) {
      showScene(pv.scene_name || sim.scene_name || 'Playing', pv.elapsed || 0, pv.total);
      if (pv.scene_id) selPlayingId = pv.scene_id;
      scenePlaying = true;
      drawSelInfo(pv.elapsed || 0, pv.total);
    }
    else if (sim.running && sim.mode === 'waiting') { showWaiting(sim.scene_name); selPlayingId = null; scenePlaying = false; drawSelInfo(); }
    else if (paused)                     showIdle('Paused');
    else { showIdle(); if (scenePlaying) { scenePlaying = false; selPlayingId = null; drawSelInfo(); } }
    render();
  } catch {
    trackReboot(false); setNextLine('');
    if (online) { online = false; render(); }
    showIdle(rebooting ? 'Rebooting…' : (Date.now() < flashUntil ? flashMsg : null));
  }
}
boot().then(() => { tick(); setInterval(tick, 900); });
</script>
